<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Skaner Planów - Panel Sterowania</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #111; color: #fff; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #5865F2; color: white; border: none; border-radius: 5px; }
        button:hover { background: #4752C4; }
    </style>
</head>
<body>
    <h1>Zarządzanie Skanerem Planów</h1>
    <p>Kliknij poniższy przycisk, aby natychmiast wymusić skanowanie na GitHubie:</p>
    <button onclick="triggerScan()">Odpal Skan!</button>
    <p id="status"></p>

    <script>
        async function triggerScan() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Wysyłanie żądania...";
            
            // Tutaj w przyszłości dopiszemy logikę wywołania GitHub API / repository_dispatch
            statusEl.innerText = "Żądanie wysłane! Sprawdź Discorda.";
        }
    </script>
</body>
</html>
