<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Skaner Planów - Panel Sterowania</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #111; color: #fff; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #5865F2; color: white; border: none; border-radius: 5px; }
        button:hover:not(:disabled) { background: #4752C4; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Zarządzanie Skanerem Planów</h1>
    <p>Kliknij poniższy przycisk, aby natychmiast wymusić skanowanie:</p>
    <button id="scanBtn" onclick="triggerScan()">Odpal Skan!</button>
    <p id="status"></p>

    <script>
        // --- KONFIGURACJA ---
        const GITHUB_USER = "Maxymilian22";
        const REPO_NAME = "school-scanner";
        const WORKFLOW_FILE = "scan.yml"; // nazwa Twojego pliku workflow w .github/workflows/
        const TOKEN = "TUTAJ_WKLEJ_SWOJ_GITHUB_TOKEN"; // Token z uprawnieniami repo / actions:write
        // --------------------

        let cooldownTime = 0;
        let cooldownTimer = null;

        async function checkActiveRuns() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/runs?status=in_progress`, {
                    headers: {
                        "Authorization": `Bearer ${TOKEN}`,
                        "Accept": "application/vnd.github+json"
                    }
                });
                if (!response.ok) return false;
                const data = await response.json();
                return data.total_count > 0;
            } catch (error) {
                console.error("Błąd sprawdzania statusu:", error);
                return false;
            }
        }

        async function triggerScan() {
            const btn = document.getElementById('scanBtn');
            const statusEl = document.getElementById('status');

            if (TOKEN === "TUTAJ_WKLEJ_SWOJ_GITHUB_TOKEN") {
                statusEl.style.color = "#ff5555";
                statusEl.innerText = "Błąd: Nie skonfigurowano tokenu GitHub w kodzie!";
                return;
            }

            statusEl.style.color = "#fff";
            statusEl.innerText = "Sprawdzanie stanu skanera...";
            btn.disabled = true;

            // 1. Sprawdź, czy skan już trwa
            const isRunning = await checkActiveRuns();
            if (isRunning) {
                statusEl.style.color = "#ffaa00";
                statusEl.innerText = "Skaner jest już aktualnie uruchomiony! Poczekaj na zakończenie.";
                btn.disabled = false;
                return;
            }

            statusEl.innerText = "Wysyłanie żądania do GitHuba...";

            try {
                // 2. Wywołaj workflow_dispatch przez API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
                    method: 'POST',
                    headers: {
                        "Authorization": `Bearer ${TOKEN}`,
                        "Accept": "application/vnd.github+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ ref: "main" })
                });

                if (response.ok || response.status === 204) {
                    statusEl.style.color = "#55ff55";
                    statusEl.innerText = "Sukces! Skan został pomyślnie uruchomiony. Sprawdź Discorda.";
                    startCooldown(60); // Blokada na 60 sekund
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "Błąd API");
                }
            } catch (error) {
                statusEl.style.color = "#ff5555";
                statusEl.innerText = "Wystąpił błąd: " + error.message;
                btn.disabled = false;
            }
        }

        function startCooldown(seconds) {
            const btn = document.getElementById('scanBtn');
            const statusEl = document.getElementById('status');
            cooldownTime = seconds;

            btn.disabled = true;

            if (cooldownTimer) clearInterval(cooldownTimer);

            cooldownTimer = setInterval(() => {
                cooldownTime--;
                if (cooldownTime > 0) {
                    btn.innerText = `Odczekaj (${cooldownTime}s)`;
                } else {
                    clearInterval(cooldownTimer);
                    btn.innerText = "Odpal Skan!";
                    btn.disabled = false;
                    statusEl.innerText = "";
                }
            }, 1000);
        }
    </script>
</body>
</html>
