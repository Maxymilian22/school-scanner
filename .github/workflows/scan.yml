name: Skaner Planow Lekcji

on:
  schedule:
    - cron: '0 13 * * 5'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scanner] # To pozwala uruchomić skaner przez zewnętrzne API

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          pip install httpx aiosqlite
          pip install "httpx[http2]" aiosqlite

      - name: Uruchomienie skanera
        env:
          DISCORD_WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL_1 }}
          DISCORD_WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
        run: |
          python skaner_bot.py
