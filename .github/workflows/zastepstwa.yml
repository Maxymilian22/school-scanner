name: Skaner Zastępstw

on:
  schedule:
    # Poniedziałek - Piątek: co 5 minut od 12:30 do 20:00 UTC (14:30 - 22:00 czasu polskiego)
    - cron: '*/5 12-20 * * 1-5'
    
    # Sobota - Niedziela: co 15 minut od 14:00 do 21:00 UTC (16:00 - 23:00 czasu polskiego)
    - cron: '*/15 14-21 * * 6,0'
    
  workflow_dispatch:

permissions:
  contents: write  # Pozwala na zapisywanie i commitowanie zmian w repozytorium przez bota

jobs:
  run-zastepstwa:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          pip install httpx "httpx[http2]" aiosqlite

      - name: Uruchomienie skanera zastępstw
        env:
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
        run: |
          python zastepstwa_bot.py

      - name: Automatyczny zapis stanu bazy danych
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zastepstwa_state.db
          # Sprawdzamy czy plik bazy się zmienił. Jeśli tak, robimy commit i push.
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update: zapis stanu bazy zastępstw [skip ci]" && git push)
